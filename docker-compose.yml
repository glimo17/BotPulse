services:
  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: botpulse-db
    environment:
      POSTGRES_DB: botpulse
      POSTGRES_USER: botpulse
      POSTGRES_PASSWORD: ${DB_PASSWORD:-botpulse_dev_2024}
    ports:
      - "5433:5432"
    volumes:
      - botpulse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botpulse -d botpulse"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - botpulse-net

  # Redis (prepared for Phase 3: cache, SignalR backplane, rate limiting)
  redis:
    image: redis:7-alpine
    container_name: botpulse-redis
    volumes:
      - botpulse-redis:/data
    networks:
      - botpulse-net

  # BotPulse API
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.Api
    container_name: botpulse-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__PostgreSQL: "Host=postgres;Port=5432;Database=botpulse;Username=botpulse;Password=${DB_PASSWORD:-botpulse_dev_2024}"
      Jwt__SigningKeyBase64: ${JWT_SIGNING_KEY}
      Jwt__Issuer: botpulse
      Jwt__Audience: botpulse-api
      Authentication__Provider: ${AUTHENTICATION_PROVIDER:-Local}
      Notifications__Transport: ${NOTIFICATION_TRANSPORT:-SSE}
      RpaProvider: ${RPA_PROVIDER:-Demo}
      UiPath__BaseUrl: ${UIPATH_BASE_URL}
      UiPath__Tenant: ${UIPATH_TENANT}
      UiPath__ClientId: ${UIPATH_CLIENT_ID}
      UiPath__ClientSecret: ${UIPATH_CLIENT_SECRET}
      UiPath__FolderId: ${UIPATH_FOLDER_ID}
      Cors__AllowedOrigins: "http://localhost,https://localhost"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - botpulse-net
    restart: unless-stopped

  # BotPulse Worker (background sync services)
  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.Worker
    container_name: botpulse-worker
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__PostgreSQL: "Host=postgres;Port=5432;Database=botpulse;Username=botpulse;Password=${DB_PASSWORD:-botpulse_dev_2024}"
      RpaProvider: ${RPA_PROVIDER:-Demo}
      UiPath__BaseUrl: ${UIPATH_BASE_URL}
      UiPath__Tenant: ${UIPATH_TENANT}
      UiPath__ClientId: ${UIPATH_CLIENT_ID}
      UiPath__ClientSecret: ${UIPATH_CLIENT_SECRET}
      UiPath__FolderId: ${UIPATH_FOLDER_ID}
      Synchronization__JobSync__IntervalSeconds: ${SYNC_JOBS_INTERVAL_SECONDS:-120}
      Synchronization__QueueItemSync__IntervalSeconds: ${SYNC_QUEUE_ITEMS_INTERVAL_SECONDS:-180}
      Synchronization__LogSync__IntervalSeconds: ${SYNC_LOGS_INTERVAL_SECONDS:-60}
      Synchronization__MetricsCollection__IntervalSeconds: ${SYNC_METRICS_INTERVAL_SECONDS:-300}
      Synchronization__AlertEvaluation__IntervalSeconds: 60
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - botpulse-net
    restart: unless-stopped

  # React Frontend
  ui:
    build:
      context: .
      dockerfile: deploy/Dockerfile.Ui
    container_name: botpulse-ui
    networks:
      - botpulse-net
    restart: unless-stopped

  # Nginx Reverse Proxy
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: botpulse-proxy
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - ui
    networks:
      - botpulse-net
    restart: unless-stopped

networks:
  botpulse-net:
    driver: bridge

volumes:
  botpulse-postgres:
  botpulse-redis:
